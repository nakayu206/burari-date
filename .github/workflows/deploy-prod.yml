name: Deploy PROD

# 何をする？
#   v1.0.0 のような「v始まりのタグ」が push されたら、
#   prod flavor で Android App Bundle (.aab) をビルドする。
#   （実際の Google Play への配信は後から追記する想定）

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-prod-android:
    name: Build PROD (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # アップロード鍵で署名する(Issue #147)。鍵とパスワードは、GitHubのSecretsに置く:
      #   ANDROID_KEYSTORE_BASE64 : 鍵のファイル(.jks)をbase64にした文字列
      #   ANDROID_KEYSTORE_PASSWORD : 鍵のパスワード(ストアと鍵で、同じ)
      #   ANDROID_KEY_ALIAS : 鍵の別名(upload)
      # Secretsが未登録のときは、署名せず(デバッグ用の署名のまま)ビルドする。その場合、
      # できたAABは、Google Playに、アップロードできない。
      - name: Prepare upload key (if secrets exist)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::署名用のSecretsが未登録です。デバッグ用の署名でビルドします(Google Playにはアップロードできません)。"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-upload}"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties

      # prod flavor でビルド（Play ストア用は aab）
      - name: Build App Bundle (prod)
        run: flutter build appbundle --flavor prod -t lib/main_prod.dart --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 30

      # ▼ Google Play へ自動配信したいときはここを有効化
      #   （要：GOOGLE_PLAY_SERVICE_ACCOUNT_JSON などの secrets 設定）
      #
      # - name: Upload to Google Play (Internal track)
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.buraridate.burari_date
      #     releaseFiles: build/app/outputs/bundle/prodRelease/app-prod-release.aab
      #     track: internal

      # GitHub Releases も自動作成（タグから）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/bundle/prodRelease/app-prod-release.aab
